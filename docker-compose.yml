version: '3.8'

services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: always

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: always

  ai-engine:
    build: ./ai-engine
    ports:
      - "8000:8000"
    restart: always

  iot-simulator:
    build:
      context: ./iot-simulator
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: always
